// sim_init.ini - Keil Simulator initialization script for SN32F407
// Muc dich: Cap quyen doc/ghi cho vung dia chi peripheral cua SN32F407
// De Keil Simulator khong bao "access violation" khi code ghi vao SN_SYS0, PFPA, GPIO, v.v.

// SN32F407 peripherals: PFPA, GPIO, CT16Bx, I2C, WDT, SYS0, SYS1...
// Tat ca nam trong vung 0x40000000 - 0x40FFFFFF (16MB, < 128MB limit)
MAP 0x40000000, 0x40FFFFFF READ WRITE

// ARM core peripherals: SysTick, NVIC, SCB (0xE0000000 - 0xE00FFFFF)
MAP 0xE0000000, 0xE00FFFFF READ WRITE

